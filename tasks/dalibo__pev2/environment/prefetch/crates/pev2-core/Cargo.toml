[package]
name = "pev2-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Rust core for pev2 plan parsing and metric computation"
license = "PostgreSQL"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.11.1"
fancy-regex = "0.14.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
wasm-bindgen = "0.2.95"
serde-wasm-bindgen = "0.6.5"
