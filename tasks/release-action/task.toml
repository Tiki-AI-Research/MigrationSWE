schema_version = "1.3"
artifacts = [
    "/logs/artifacts",
]

[task]
name = "tikiai/release-action"
description = "Migrate the release GitHub Action from TypeScript 6.0.3 to Go 1.23.0."

[metadata]
category = "Language_migration"
language = "typescript"
repository_id = "08d0894c-e49f-4dac-999e-c15a50ad3737"
task_id = "tp-0febd1d0b48c58875bdce28724fa92d1"
repository_url = "https://github.com/ncipollo/release-action"
base_commit_hash = "389305c50bc7406ce7e55077eb8b863e0f0a3083"

[metadata.tests]
fail_to_pass_count = 52
pass_to_pass_count = 40

[verifier]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
]
environment_mode = "separate"
user = "root"
timeout_sec = 3600.0

[verifier.environment]
network_mode = "public"
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

docker_image = "docker.io/tikiaiteam/migration:release-action-verifier-image-20261126"
image_digest = "sha256:5a5ba81a46b2be9ccd60013b34f5d5b643c0beb48077875dad48206617129985"
[[verifier.collect]]
command = "cd /workspace/repo && mkdir -p /logs/artifacts && git add -A -- . && git diff --binary --cached 389305c50bc7406ce7e55077eb8b863e0f0a3083 > /logs/artifacts/model.patch"
timeout_sec = 300.0

[verifier.env]
MIGRATION_CANDIDATE_ISOLATION = "setuid"

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
]
timeout_sec = 14400
user = "agent"

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 20480

docker_image = "docker.io/tikiaiteam/migration:release-action-task-image-20261126"
image_digest = "sha256:e353438ec7602fb5bea42bf8e79c708ae4581604ceee76bd89f78271e4933cc1"
