# Contract fixture: exercises every accepted configuration shape.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

source:
  - changed-files:
      - any-glob-to-all-files:
          - 'src/**'

tests:
  - changed-files:
      - all-globs-to-any-file:
          - 'test/**'
          - 'tests/**'

feature:
  - head-branch:
      - '^feature/.*$'

targeted:
  - changed-files:
      - all-globs-to-all-files:
          - 'src/**'
          - 'src/backend/**'
  - base-branch:
      - '^main$'

grouped:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'docs/**'
      - head-branch:
          - '^feature/.*$'
  - all:
      - changed-files:
          - all-globs-to-all-files:
              - 'src/**'
              - 'src/frontend/**'

changed-files-labels-limit: 2
max-files-changed: 1000
