schema_version = "1.3"
artifacts = [
    "/logs/artifacts",
]

[task]
name = "tikiai/fables-tales-rubyfmt"
description = "Migrate the rubyfmt formatter and CLI from Rust to Go 1.24.0."

[metadata]
category = "Language_migration"
language = "rust"
repository_id = "efd35dcd-6719-4a55-994b-396f860d7685"
task_id = "tp-3a47ef70c1556945ac0b8fd37bba1d2d"
repository_url = "https://github.com/fables-tales/rubyfmt"
base_commit_hash = "5185d3beb9b4b9052587292d7ac5bf374992e8fe"

[metadata.tests]
fail_to_pass_count = 64
pass_to_pass_count = 32

[verifier]
network_mode = "allowlist"
allowed_hosts = []
environment_mode = "separate"
user = "root"
timeout_sec = 3600.0

[verifier.environment]
network_mode = "public"
allowed_hosts = []
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

docker_image = "docker.io/tikiaiteam/migration:fables-tales-rubyfmt-verifier-image-20261126"
image_digest = "sha256:4249034c6637e538ff5f12cff3d291dab4389afed981f65a5ba5f5263da8659a"
[[verifier.collect]]
command = "cd /workspace/repo && mkdir -p /logs/artifacts && git add -A -- . && git diff --binary --cached 5185d3beb9b4b9052587292d7ac5bf374992e8fe > /logs/artifacts/model.patch"
timeout_sec = 300.0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
]
timeout_sec = 14400
user = "agent"

[environment]
network_mode = "public"
allowed_hosts = []
build_timeout_sec = 3600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 20480

docker_image = "docker.io/tikiaiteam/migration:fables-tales-rubyfmt-task-image-20261126"
image_digest = "sha256:c931f0f7196e350a483995e219d7de38514deb0fd22d0b305825214c8a11180a"
