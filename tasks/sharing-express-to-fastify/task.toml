description = "Migrate the easy-sharing HTTP server from Express 4 to Fastify 4.28.1."
authors = []
keywords = ["framework-migration", "javascript", "express", "fastify", "nodejs"]

[metadata]
task_id = "sharing-express-to-fastify"
category = "Framework_migration"
language = "javascript"
repository_url = "https://github.com/parvardegr/sharing"
base_commit_hash = "e103cc3124227f42ea1e31f138560cbe7c031904"
source_technology = "Express 4"
target_technology = "Fastify 4"
persistent_state_involved = false
f2p_count = 10
p2p_count = 56
migration_units = ["fastify_dependencies", "app_exports_contract", "no_express_in_production"]

[metadata.tests]
