[agent]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 14400

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480

docker_image = "docker.io/tikiaiteam/migration:sharing-express-to-fastify-task-image-20261126"
