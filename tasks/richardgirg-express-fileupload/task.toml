keywords = []

[metadata]
task_id = "richardgirg-express-fileupload-20260909092636-c2cf52-r2"
original_title = "express-fileupload: Express middleware for handling multipart file uploads"
category = "Framework_migration"
language = "JavaScript"
repository_url = "https://github.com/richardgirges/express-fileupload"
base_commit_hash = "20269154bb9aab9672e7ff7ca500349e5d23fb5c"

[metadata.migration]
source_framework = "express"
source_framework_version = "4.21.2"
source_package = "express-fileupload"
source_package_version = "1.5.2"
target_framework = "koa"
target_framework_version = "2.16.4"
runtime = "node@18.20.8"
persistent_state_involved = false
persistent_state_boundary = "Stateless middleware: no database, cache or queue is touched, and no state survives a request. The only persisted artefact is an optional temporary upload file, created per request under tempFileDir and removed by the same request (or by the caller-supplied cleanup)."
invariants = [
  "the public contract stays express-fileupload compatible: module.exports = (options) => middleware",
  "the middleware accepts both (req, res, next) and (ctx, next) call shapes",
  "uploaded-file metadata (name, size, mimetype, md5, data/tempFilePath) is unchanged",
  "no runtime dependency is added, removed or upgraded (busboy ^1.6.0 is the only runtime dependency)",
  "the frozen test suite under test/ is not modified, skipped or weakened",
]

